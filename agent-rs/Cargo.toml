[package]
name = "doudian-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DoudianRemoteQR"
path = "src/main.rs"

[build-dependencies]
winresource = "0.1"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
base64 = "0.22"
image = "0.25"
rqrr = "0.11"
tiny_http = "0.12"
open = "5"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm"] }
windows-capture = "=1.5.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
