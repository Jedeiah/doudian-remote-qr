<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>管理员登录 · 抖店扫码助手</title><link rel="stylesheet" href="/admin/static/style.css"></head>
<body><div class="login-wrap"><div class="card login-card"><div class="brand"><div class="logo">管</div><div><h1>抖店扫码助手</h1><p>系统管理</p></div></div><h2>管理员登录</h2><p class="sub">仅超级管理员可进入</p><div id="err" class="alert error"></div><form id="form"><div class="field"><label>账号</label><input id="username" value="admin" autocomplete="username" required></div><div class="field"><label>密码</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary w100" type="submit">登 录</button></form><div id="pwbox" style="display:none;margin-top:18px"><p class="sub">首次登录必须修改管理员密码</p><div class="field"><label>新密码</label><input id="newpwd" type="password" autocomplete="new-password" placeholder="至少 10 位，含字母和数字"></div><div class="field"><label>确认新密码</label><input id="newpwd2" type="password" autocomplete="new-password"></div><button class="btn btn-primary w100" id="pwbtn" type="button">保存新密码</button></div></div></div>
<script>const err=document.getElementById('err');if(new URLSearchParams(location.search).get('expired')){err.textContent='登录已失效，请重新登录';err.className='alert error show'}document.getElementById('form').onsubmit=async e=>{e.preventDefault();err.className='alert error';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value,role:'admin'})});const j=await r.json();if(!r.ok)throw new Error(j.detail||'登录失败');if(j.must_change_password){window.__oldpwd=document.getElementById('password').value;document.getElementById('pwbox').style.display='block';return}location.href='/admin/app'}catch(x){err.textContent=x.message;err.className='alert error show'}};document.getElementById('pwbtn').onclick=async()=>{const np=document.getElementById('newpwd').value;const np2=document.getElementById('newpwd2').value;if(np.length<10||!/[A-Za-z]/.test(np)||!/[0-9]/.test(np)){err.textContent='新密码至少 10 位且需包含字母和数字';err.className='alert error show';return}if(np!==np2){err.textContent='两次输入不一致';err.className='alert error show';return}const r=await fetch('/auth/change-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:window.__oldpwd,new_password:np})});const j=await r.json();if(!r.ok){err.textContent=j.detail||'修改失败';err.className='alert error show';return}alert('密码已修改，请用新密码重新登录');location.href='/admin'}</script></body></html>
